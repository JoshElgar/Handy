name: "Remote macOS build"

on: workflow_dispatch

jobs:
  macos:
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      TRANSCRIBE_CMAKE_ARGS: "-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: clippy

      # Skip the Rust cache so a bundle built with the runner's default target cannot be restored.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download VAD model
        run: |
          mkdir -p src-tauri/resources/models
          curl -L --fail --show-error --retry 3 \
            -o src-tauri/resources/models/silero_vad_v4.onnx \
            https://blob.handy.computer/silero_vad_v4.onnx

      - name: Check frontend lint and formatting
        run: |
          bun run lint
          bun run format:check

      - name: Build frontend for Rust tests
        run: bun run build

      - name: Run remote transcription Rust tests
        working-directory: src-tauri
        run: cargo test --release --target aarch64-apple-darwin --locked --lib remote_

      - name: Run Rust Clippy
        working-directory: src-tauri
        # The repository has existing Clippy warnings; keep them visible without failing the build.
        run: cargo clippy --release --target aarch64-apple-darwin --locked --all-targets

      - name: Build Apple Silicon app
        run: >-
          bun run tauri build --target aarch64-apple-darwin --bundles app
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Verify and zip app
        run: |
          set -euo pipefail
          app="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Handy Remote.app"
          binary="$app/Contents/MacOS/handy"
          test -d "$app"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")"
          bundle_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$app/Contents/Info.plist")"
          test "$bundle_id" = "com.joshelgar.handy.remote"
          test "$bundle_name" = "Handy Remote"
          codesign --verify --deep --strict "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -Fq 'Signature=adhoc'
          platform="$(xcrun dyld_info -platform "$binary")"
          printf '%s\n' "$platform"
          grep -Eq 'macOS[[:space:]]+11\.0[[:space:]]' <<< "$platform"
          xcrun dyld_info -imports "$binary" | grep -F '_OBJC_CLASS_$_MTLResidencySetDescriptor' || true
          ditto -c -k --sequesterRsrc --keepParent \
            "$app" Handy-Remote-macos-aarch64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: Handy-Remote-macos-aarch64
          path: Handy-Remote-macos-aarch64.zip
          if-no-files-found: error
          retention-days: 30
